<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Men's Precepts">
<title>Men's Precepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Men's Precepts demo, built on Interconnected. Sample data only; nothing is saved. */
:root {
  --blue: #2563EB; --blue-soft: #E8EFFD; --navy: #0F1B33; --navy-2: #1B2A4A;
  --ink: #1F2937; --muted: #5B6472; --line: #E5E7EB; --bg: #F3F4F6; --card: #FFFFFF;
  --green: #059669; --green-soft: #E3F5EE; --amber: #B45309; --amber-soft: #FDF1E3;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light only;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--navy); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; font-size: 16px; color: var(--ink); }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; overflow: clip; }
@media (min-width: 520px) { body { padding: 24px 0; } .app { height: calc(100% - 48px); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.35); } }

/* header */
.top { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; display: flex; align-items: center; gap: 12px; flex: none; }
.top .mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
.top .t { flex: 1; min-width: 0; }
.top h1 { font-size: 1.02rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top .sub { font-size: .78rem; color: #AFC0DE; margin: 0; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; position: relative; color: #fff; }
.iconbtn:hover { background: rgba(255,255,255,.08); }
.badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: #EF4444; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.leaderbar { background: #E9EEF8; color: var(--navy-2); font-size: .8rem; font-weight: 600; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; flex: none; }
.leaderbar button { text-decoration: underline; font-weight: 700; color: var(--blue); padding: 11px 0; text-align: right; }
.leaderbar { gap: 10px; }

/* body */
.screen { flex: 1; overflow-y: auto; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; }
.sec-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 2px 8px; }
.sec-label:first-child { margin-top: 2px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid var(--line); }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }

/* lesson hero */
.lesson { background: linear-gradient(160deg, var(--navy-2), var(--navy)); color: #fff; border: 0; padding: 18px; }
.lesson .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: #93B4F5; font-weight: 700; }
.lesson .title { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
.lesson .passage { color: #C9D6EE; font-weight: 500; }
.meet { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 12px; align-items: center; }
.meet .when { font-weight: 600; }
.meet .where { color: #C9D6EE; font-size: .85rem; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; border-radius: 999px; padding: 10px 14px; min-height: 40px; font-weight: 600; font-size: .85rem; }
.pillbtn.ghost { background: var(--blue-soft); color: var(--blue); }
.pillbtn.light { background: rgba(255,255,255,.12); color: #fff; }

/* announcement */
.ann .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ann h3 { font-size: 1rem; margin: 4px 0 4px; }
.ann p { margin: 0; }
.tag { font-size: .7rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--blue-soft); color: var(--blue); }
.tag.pin { background: var(--amber-soft); color: var(--amber); }
.anntools { margin-top: 10px; padding-top: 2px; border-top: 1px solid var(--line); display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.anntools > button { font-size: .85rem; font-weight: 700; color: var(--amber); padding: 10px 0; }
.anntools > button.muted { color: var(--muted); font-weight: 600; }
.tag.green { background: var(--green-soft); color: #047857; }

/* files */
.file { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; padding-top: 0; }
.file:last-child { padding-bottom: 0; }
.ficon { width: 38px; height: 44px; border-radius: 7px; display: grid; place-items: center; font-size: .62rem; font-weight: 800; color: #fff; flex: none; letter-spacing: .03em; }
.ficon.pdf { background: #DC2626; } .ficon.doc { background: #2563EB; } .ficon.audio { background: #7C3AED; } .ficon.slides { background: #D97706; } .ficon.sheet { background: #059669; }
.file .fn { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.file .fm { font-size: .76rem; color: var(--muted); }
.lessonhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.lessonhead strong { font-size: .95rem; }
.schedrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; border-top: 1px solid var(--line); }
.schedrow:first-child { border-top: 0; }
.schedrow .sd { flex: none; width: 92px; font-size: .8rem; font-weight: 700; color: var(--blue); }
.schedrow svg { flex: none; color: var(--muted); }
.schedgap { padding: 10px 0 10px 104px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); font-style: italic; }

/* prayer chain */
.partner { text-align: center; padding: 22px 16px; }
.partner .av { margin: 0 auto 10px; }
.partner .name { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
.chainlist { list-style: none; margin: 0; padding: 4px 14px; }
.chainlist .link { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.chainlist .link:first-child { border-top: 0; }
.chainlist .who { font-weight: 600; }
.chainlist .calls { color: var(--muted); font-size: .85rem; }
.chainlist .link.me .who:first-child, .chainlist .link.tome .who:last-child { color: var(--blue); font-weight: 800; }
.calledby { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .88rem; color: var(--muted); }
.calledby .av { width: 28px; height: 28px; font-size: .62rem; margin: 0; }
.pair { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.pair:first-child { border-top: 0; padding-top: 0; }
.pair .x { color: var(--muted); flex: none; }
.pair .n { flex: 1; min-width: 0; }
.pair .pr { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }

/* leader extras: same screens, a few extra buttons */
.leaderadd { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 12px 0 0; padding: 12px; border-radius: 12px; border: 1.5px dashed #E9C38F; background: var(--amber-soft); color: var(--amber); font-weight: 700; }
.screen > .leaderadd:first-child { margin: 0 0 4px; }
.leadercard { border-color: #F3D9B8; }
.groupswitch { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-weight: 600; background: rgba(255,255,255,.12); border-radius: 999px; padding: 6px 12px; min-height: 36px; margin-top: 2px; font-size: .8rem; }
.ph { text-decoration: none; }

/* profile + chain */
.mebtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.mebtn .av { width: 32px; height: 32px; font-size: .7rem; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.linkish { display: inline-block; margin-top: 2px; padding: 10px 6px; color: var(--blue); font-weight: 700; font-size: .9rem; cursor: pointer; }
.readonly { padding: 11px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.chainchip { flex: none; font-size: .74rem; font-weight: 700; border-radius: 999px; padding: 10px 12px; border: 1px solid var(--line); color: var(--muted); background: #fff; }
.chainchip.on { background: var(--blue-soft); border-color: var(--blue-soft); color: var(--blue); }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; color: #fff; flex: none; }
.av.lg { width: 56px; height: 56px; font-size: 1.1rem; margin: 0 auto 10px; }

/* group feed: casual posts with short replies */
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 10px 12px; }
.composer .av { width: 40px; height: 40px; }
.composer textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px; background: var(--bg); resize: none; height: 42px; max-height: 140px; outline: none; font: inherit; font-size: 16px; line-height: 1.4; padding-top: 10px; }
@media (max-width: 350px) { .composer .av { display: none; } }
.composer textarea:focus { border-color: var(--blue); background: #fff; }
.postbtn { background: var(--blue); color: #fff; border-radius: 999px; height: 42px; padding: 0 18px; font-weight: 700; font-size: .9rem; flex: none; }
.post { padding: 12px 14px; }
.post .head { display: flex; gap: 10px; align-items: center; }
.post .av { width: 32px; height: 32px; font-size: .7rem; }
.post .who { font-weight: 700; font-size: .9rem; }
.post .when { font-size: .74rem; color: var(--muted); }
.post .body { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.replies { margin-top: 10px; display: grid; gap: 6px; }
.rep { display: flex; gap: 8px; align-items: flex-start; }
.rep .av { width: 24px; height: 24px; font-size: .58rem; margin-top: 2px; }
.rep .rb { text-align: left; display: block; background: var(--bg); border-radius: 12px; padding: 6px 10px; font-size: .88rem; min-width: 0; overflow-wrap: anywhere; }
.rep .rb strong { font-size: .8rem; }
.postacts { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.postacts button { font-size: .85rem; font-weight: 700; color: var(--blue); padding: 8px 0; min-height: 40px; }
.postacts button.muted { color: var(--muted); font-weight: 600; }
.delask { font-size: .82rem; color: var(--ink, #111); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 4px 0; }
.delask button { font-weight: 700; color: var(--muted); padding: 10px 0; }
.delask button.danger, .rmlink { color: #B42318; }
.rmlink { font-size: .78rem; font-weight: 600; padding: 8px 2px; }
.textbtn { font-weight: 700; padding: 10px 4px; color: var(--muted); }
.textbtn.danger { color: #B42318; }
.leaderrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.leaderrow .leaderadd { margin: 0; }
.xbtn { width: 40px; height: 40px; display: grid; place-items: center; flex: none; color: var(--muted); }
.confirm { background: #FEF3F2; border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: .85rem; display: grid; gap: 8px; }
.pillbtn.danger { background: #B42318; color: #fff; border-color: #B42318; }
.pillbtn.light2 { background: #fff; color: var(--navy-2); border: 1px solid var(--line); }
.replyform { display: flex; gap: 6px; margin-top: 8px; }
.replyform input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: var(--bg); outline: none; font-size: 16px; }
.replyform input:focus { border-color: var(--blue); background: #fff; }
.replyform button { color: var(--blue); font-weight: 700; font-size: .85rem; padding: 0 6px; min-height: 40px; }
.replyform button.muted { color: var(--muted); font-weight: 600; }

/* prayer chain */
.phone { font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.callrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.callbtn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border-radius: 12px; padding: 12px; font-weight: 700; text-decoration: none; background: var(--blue); color: #fff; }
.callbtn.alt { background: var(--blue-soft); color: var(--blue); }
.minicall { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 12px; min-height: 40px; font-weight: 700; font-size: .84rem; text-decoration: none; background: var(--blue); color: #fff; flex: none; }
.ph { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* tabs */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; column-gap: 2px; background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; white-space: nowrap; font-size: .7rem; min-width: 0; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--blue); }
.tab svg { width: 22px; height: 22px; }
@media (max-width: 350px) { .tab { font-size: .6rem; padding: 6px 1px; } }

/* overlays */
#sheet { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; transform: translateX(100%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
#sheet.open { transform: none; visibility: visible; transition: transform .22s ease; }
#sheet .top { background: #fff; color: var(--ink); border-bottom: 1px solid var(--line); }
#sheet .top .iconbtn { color: var(--ink); }
#sheet .top .iconbtn:hover { background: var(--bg); }
#sheet .top h1 { font-size: 1rem; }
#sheet .top .sub { color: var(--muted); }
.inputbar { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: #fff; border-top: 1px solid var(--line); }
.inputbar input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; background: var(--bg); outline: none; }
.inputbar input:focus { border-color: var(--blue); }
.sendbtn { width: 42px; height: 42px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.bubbles { display: grid; gap: 8px; }
.bubble { max-width: 80%; padding: 9px 13px; border-radius: 16px; background: #fff; border: 1px solid var(--line); justify-self: start; }
.bubble.mine { background: var(--blue); color: #fff; border-color: var(--blue); justify-self: end; }
.bubble .bt { font-size: .7rem; opacity: .7; margin-top: 2px; }
.convo { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.convo:first-child { border-top: 0; padding-top: 0; }
.convo .cn { font-weight: 600; }
.convo .cp { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; }

/* forms */
.field { display: grid; gap: 6px; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: #fff; outline: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--blue); }
.field textarea { min-height: 110px; resize: vertical; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: .84rem; font-weight: 600; }
.seg button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.bigbtn { width: 100%; background: var(--blue); color: #fff; border-radius: 12px; padding: 13px; font-weight: 700; }
.bigbtn.secondary { background: var(--blue-soft); color: var(--blue); }
.check { display: flex; gap: 10px; align-items: center; font-size: .9rem; min-height: 40px; }
.check input { width: 20px; height: 20px; }
.drop { border: 2px dashed #C7D2E5; border-radius: 12px; padding: 18px; text-align: center; background: #fff; }
.note { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 4px; }
.demobtn { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: .85rem; font-weight: 600; background: transparent; }

/* sign in */
.signin { position: absolute; inset: 0; z-index: 40; background: linear-gradient(170deg, var(--navy-2), var(--navy)); color: #fff; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; padding: 32px 28px calc(env(safe-area-inset-bottom, 0px) + 32px); gap: 18px; }
.signin > :first-child { margin-top: auto; }
.signin > :last-child { margin-bottom: auto; }
.signin .big { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.signin p { color: #C9D6EE; margin: 0; }
.signin form input { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 1rem; }
.signin .mailcard p { color: var(--muted); }
.signin .powered { font-size: .76rem; color: #8FA3C7; text-align: center; }
.mailcard { background: #fff; color: var(--ink); border-radius: 14px; padding: 16px; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 16px; font-size: .85rem; font-weight: 600; opacity: 0; transition: all .2s; z-index: 60; pointer-events: none; max-width: 92%; width: max-content; text-align: center; line-height: 1.3; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #sheet, .toast { transition: none; } }

/* ---------- design options (pick one; open the demo with ?look=2 … ?look=5). Option 1 is the default above. ---------- */
/* 2 · Clean white: white header, open layout, thin dividers instead of boxes */
[data-look="2"] body, [data-look="2"] .app { background: #fff; }
[data-look="2"] .top { background: #fff; color: var(--ink); border-bottom: 1px solid var(--line); }
[data-look="2"] .top .sub { color: var(--muted); }
[data-look="2"] .top .iconbtn { color: var(--ink); }
[data-look="2"] .top .mark { background: var(--blue-soft); }
[data-look="2"] .top .mark g { fill: var(--blue); }
[data-look="2"] .groupswitch { background: var(--bg); color: var(--ink); }
[data-look="2"] .mebtn .av { box-shadow: none; }
[data-look="2"] .leaderbar { background: #F8FAFC; border-bottom: 1px solid var(--line); }
[data-look="2"] .screen > .card, [data-look="2"] .stack > .card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding-left: 2px; padding-right: 2px; }
[data-look="2"] .stack { gap: 0; }
[data-look="2"] .lesson { background: #fff; color: var(--ink); border: 1px solid var(--line) !important; border-top: 4px solid var(--blue) !important; border-radius: 14px !important; padding: 18px !important; }
[data-look="2"] .lesson .eyebrow { color: var(--blue); }
[data-look="2"] .lesson .passage, [data-look="2"] .meet .where { color: var(--muted); }
[data-look="2"] .meet { border-top-color: var(--line); }
[data-look="2"] .pillbtn.light { background: var(--blue-soft); color: var(--blue); }
[data-look="2"] .sec-label { color: var(--ink); }
[data-look="2"] .chainlist { padding: 4px 2px; }

/* 3 · Bold blue: brand-blue header and hero, rounder cards with soft shadows */
[data-look="3"] body { background: #1D4ED8; }
[data-look="3"] .app { background: #F1F5FD; }
[data-look="3"] .top { background: var(--blue); }
[data-look="3"] .top .sub { color: #DCE7FD; }
[data-look="3"] .top .mark { background: rgba(255,255,255,.16); }
[data-look="3"] .top .mark g { fill: #fff; }
[data-look="3"] .groupswitch { background: rgba(255,255,255,.18); }
[data-look="3"] .leaderbar { background: #DCE7FD; }
[data-look="3"] .card { border: 0; border-radius: 20px; box-shadow: 0 1px 2px rgba(15,27,51,.05), 0 6px 18px rgba(15,27,51,.07); }
[data-look="3"] .lesson { background: linear-gradient(150deg, #3B82F6, #1D4ED8); border-radius: 24px; padding: 22px; }

// The prayer chain is opt-in (default No). Sample: most men have said yes; a few haven't. Noah decides at sign-up.
Object.values(men).forEach(m => { m.inChain = true; m.email = m.id + '@example.com'; });
['petelangley', 'doughensley', 'paulwhitfield', 'ethanmoore', 'timreyes', 'garylindqvist', 'brentivers', 'owenblake'].forEach(id => { if (men[id]) men[id].inChain = false; });
men[NOAH].inChain = false; men[NOAH].email = 'noah@joininterconnected.com';
const chainIds = g => Object.values(men).filter(m => m.inChain && chainOf(m.id) === g).map(m => m.id);
// Left column: the chain's order (fixed). Right column: the same list, shifted by S.shift[g].
// Week 1 is A calls B, B calls C… Each week the right side moves up one and the top name goes to
// the bottom, so every man calls someone new. Shifting would eventually land on "call yourself";
// that week is skipped and the cycle starts over.
S.chain.sat = shuffled(chainIds('sat'));
S.chain.thu = shuffled(chainIds('thu'));
S.shift = { sat: 1, thu: 1 }; // week 1: each man calls the man below him (A calls B, B calls C…)
// A man removed mid-week stays in the order until Sunday but is skipped: whoever was calling him
// calls the man he would have called. Only that one man's name changes; the circle stays whole.
const gone = id => men[id] && men[id].removed;
const callee = (g, i) => { const C = S.chain[g], n = C.length, s = S.shift[g]; let j = (i + s) % n, k = 0; while (gone(C[j]) && k++ < n) j = (j + s) % n; return C[j]; };
const caller = (g, i) => { const C = S.chain[g], n = C.length, s = S.shift[g]; let j = ((i - s) % n + n) % n, k = 0; while (gone(C[j]) && k++ < n) j = ((j - s) % n + n) % n; return C[j]; };
// Remove a man from his group right away. Returns who now calls whom, or that the chain was rebuilt.
function removeFromGroup(id) {
  const g = chainOf(id), C = S.chain[g], i = C.indexOf(id);
  const A = i >= 0 ? caller(g, i) : null, B = i >= 0 ? callee(g, i) : null;
  men[id].removed = true; men[id].pending = i >= 0 ? 'leave' : undefined;
  if (i < 0 || C.filter(x => !gone(x)).length < 2) return {}; // fewer than two left: there's no chain to keep
  // If closing the gap would leave a man calling himself (tiny chains), rebuild the chain now instead.
  if (C.some((x, k) => !gone(x) && callee(g, k) === x)) {
    C.filter(gone).forEach(x => { leaveChain(x); men[x].pending = undefined; });
    return { rebuilt: true };
  }
  return { A, B };
}
function fixShift(g) { const n = S.chain[g].length; if (n < 2) { S.shift[g] = 1; return; } S.shift[g] = ((S.shift[g] - 1) % (n - 1) + (n - 1)) % (n - 1) + 1; }
// Next week: move the right side up one (top name to the bottom), skipping "call yourself".
function nextWeek(g) { const n = S.chain[g].length; if (n < 2) return; S.shift[g] = S.shift[g] + 1 > n - 1 ? 1 : S.shift[g] + 1; }
// Joining puts a man into the chain's order.
function joinChain(id) {
  const C = S.chain[chainOf(id)];
  men[id].inChain = true;
  if (C.includes(id)) return;
  const g = chainOf(id);
  const m = id === NOAH ? C.indexOf('markellison') : -1;
  if (m >= 0) C.splice(m, 0, id); else C.push(id); // demo: Noah lands just above Mark, so he calls Mark in week 1
  fixShift(g);
}
// Men who join or leave wait for the next Sunday morning; the chain only changes then.
// pending: 'join' | 'leave' | undefined. wantsChain = where he'll be after Sunday.
const wantsChain = id => men[id].inChain ? men[id].pending !== 'leave' : men[id].pending === 'join';
function setChainWish(id, yes) {
  const m = men[id];

}
// Every Sunday morning, automatically: This Week moves to the next lesson, men who left drop off,
// the right side moves up one, men who joined are added, and every man gets his new name
// (a notification, or an email if he hasn't turned notifications on). No leader button.
function sundayMorning() {
  Object.values(men).forEach(m => { if (m.pending === 'leave') leaveChain(m.id); });
  ['sat', 'thu'].forEach(g => nextWeek(g));
  Object.values(men).forEach(m => { if (m.pending === 'join') joinChain(m.id); });
  Object.values(men).forEach(m => { m.pending = undefined; });
  S.weekIdx++; S.week = weekLabel(S.weekIdx);
}
function leaveChain(id) {
  const C = S.chain[chainOf(id)];
  men[id].inChain = false;
  const g = chainOf(id);
  const i = C.indexOf(id); if (i >= 0) C.splice(i, 1);
  fixShift(g);
}

    const fi = $('ufile'); if (fi) fi.onchange = e => { [...e.target.files].forEach(f => S.up.picked.push({ name: f.name, type: ftype(f.name), size: f.size > 1e6 ? (f.size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1e3)) + ' KB' })); renderSheet(); };
  } else if (kind === 'manage') {
    const g = myGroup(), list = groupIds(g);
    const row = id => { const m = men[id], inThis = chainOf(id) === g;

    sh.innerHTML = sheetTop(arg === 'chain' ? 'Manage prayer chain' : `Manage ${esc(GROUPS[g].name)}`, `${esc(GROUPS[g].name)} · ${list.length} men`) + `<div class="screen">
      <div class="card"><div class="field"><label for="invite">Add a man to the group</label><div class="row"><input id="invite" type="email" placeholder="Email address"><button class="pillbtn" data-act="invite">${ic('plus', 16)} Invite</button></div></div></div>
      <div class="card" style="margin-top:10px">${list.map(row).join('')}</div>

  } else if (kind === 'profile') {
    const m = men[S.me], groups = myGroups().map(k => GROUPS[k].name).join(' and ');
    sh.innerHTML = sheetTop('My profile', '') + `<div class="screen"><div class="card stack">
      <div style="text-align:center">${av(S.me, 'lg')}<label class="linkish" for="pphoto">${m.photo ? 'Change photo' : 'Add a photo'}</label><input type="file" id="pphoto" accept="image/*" hidden></div>
      <div class="field"><label for="ename">Name</label><input id="ename" value="${esc(m.name)}"></div>
      <div class="field"><label for="ephone">Cell number</label><input id="ephone" type="tel" value="${esc(m.phone)}"></div>

      <div class="field"><label>Prayer chain</label><div class="seg">${seg('pchain', 1, S.profChain, "I'm in")}${seg('pchain', 0, !S.profChain, 'Not now')}</div><span class="small muted">Saved with the button below. Changes start Sunday morning, when the chain moves.</span></div>
      <p class="small muted" style="margin:0">${PRIVACY} Your email is used only for sign-in links and announcements.</p>
      <button class="bigbtn" data-act="saveprofile">Save</button>

    $('pphoto').onchange = e => { const f = e.target.files[0]; if (!f) return; men[S.me].photo = URL.createObjectURL(f); const a = document.querySelector('#sheet .av'); if (a) a.outerHTML = av(S.me, 'lg'); const l = document.querySelector('#sheet .linkish'); if (l) l.textContent = 'Change photo'; renderTop(); toast('Photo updated'); };
  } else if (kind === 'schedule') {
    sortLessons(); const cur = thisLesson();
    const rows = LESSONS.map((L, i) => { const prev = LESSONS[i - 1], gaps = [];
      if (prev) for (let d = addDays(prev.d, 7); dn(d) < dn(L.d); d = addDays(d, 7)) gaps.push(`<div class="schedgap">No class · ${pairLabel(d)}</div>`);
      return gaps.join('') + `<button class="schedrow" data-act="editlesson" data-n="${L.n}"><span class="sd">${pairLabel(L.d)}</span><span style="flex:1;min-width:0"><span style="font-weight:700;display:block">Lesson ${L.n}: ${esc(L.title)}${cur && cur.n === L.n ? ' <span class="tag green">This week</span>' : ''}</span><span class="small muted">${esc(L.passage)}</span></span>${ic('chev', 16)}</button>`; }).join('');
    sh.innerHTML = sheetTop('Lesson schedule', 'Matthew · Thursday and Saturday') + `<div class="screen">
      <div class="card">${rows}</div>
      <button class="bigbtn secondary" style="margin-top:12px" data-act="editlesson" data-n="new">${ic('plus', 18)} Add a lesson</button>

  } else if (kind === 'lesson') {
    const isNew = arg === 'new', last = LESSONS[LESSONS.length - 1];
    const L = isNew ? { n: Math.max(...LESSONS.map(x => x.n)) + 1, title: '', passage: '', d: addDays(last.d, 7) } : lessonOf(+arg);
    S.editN = isNew ? 'new' : L.n;
    const hasFiles = !isNew && S.files.some(f => f.lesson === L.n);
    sh.innerHTML = sheetTop(isNew ? 'Add a lesson' : `Lesson ${L.n}`, 'Lesson schedule') + `<div class="screen"><div class="card stack">
      <div class="field"><label for="ltitle">Title</label><input id="ltitle" value="${esc(L.title)}" placeholder="Lesson ${L.n} title"></div>
      <div class="field"><label for="lpassage">Passage</label><input id="lpassage" value="${esc(L.passage)}" placeholder="Matthew 9:1–13"></div>
      <div class="field"><label for="ldate">Saturday class</label><input id="ldate" type="date" value="${isoOf(L.d)}"><span class="small muted">The Thursday group meets two days before. Pick any day and it moves to that week's Saturday.${isNew ? '' : ' Moving this date moves the lessons after it by the same amount.'}</span></div>
      <button class="bigbtn" data-act="savelesson">${isNew ? 'Add lesson' : 'Save'}</button>
      ${isNew ? '' : S.confirmLesson ? `<div class="confirm" style="margin:0"><span>${hasFiles ? `Lesson ${L.n} has files. Delete them from Files first, or keep the lesson.` : `Delete Lesson ${L.n}? The lessons after it keep their dates.`}</span><div class="row">${hasFiles ? '' : `<button class="pillbtn danger" data-act="lessonyes">Delete</button>`}<button class="pillbtn light2" data-act="lessonno">${hasFiles ? 'OK' : 'Cancel'}</button></div></div>` : `<button class="textbtn danger" data-act="lessonask">Delete lesson</button>`}</div></div>`;
  } else if (kind === 'pickgroup') {
    sh.innerHTML = sheetTop('Switch group', 'You lead more than one group') + `<div class="screen"><div class="card">${myGroups().map(k => `<button class="convo" data-act="setgroup" data-v="${k}"><span class="av" style="background:var(--navy)">${ic(GROUPS[k].zoom ? 'video' : 'group', 18)}</span><div style="flex:1;min-width:0"><div class="cn">${esc(GROUPS[k].name)}</div><div class="cp">${esc(GROUPS[k].when)} · ${groupIds(k).length} men</div></div>${k === myGroup() ? `<span style="color:var(--blue)">${ic('check', 20, 2.4)}</span>` : ''}</button>`).join('')}</div>
      <p class="note">Everything in the app switches to the group you pick.</p></div>`;
  }
}

  el.innerHTML = S.signinStep === 0 ? `
    <div>${MARK.replace('width="20" height="24"', 'width="40" height="48"')}</div>
    <h2 class="big">Men's Precepts</h2>

    <form data-form="signin" class="stack" style="gap:12px">

      <button class="bigbtn">Email me a sign-in link</button>
      <p class="small" style="color:#AFC0DE;margin:0">No password to remember. We email you a link and you're in.</p>
    </form>
    <div class="powered">Powered by Interconnected · Demo with sample data</div>` : `
    <h2 class="big">Check your email</h2>
    <p>We sent a sign-in link to ${esc($('email') ? $('email').value : 'your email')}.</p>
    <div class="mailcard"><div class="row small muted">${ic('mail', 18)} Men's Precepts · now</div><div style="font-weight:700;margin-top:8px">Your sign-in link</div><div class="small muted" style="margin:4px 0 12px">Tap below to open Men's Precepts. This link works once.</div><button class="bigbtn" data-act="tostep2">Sign in to Men's Precepts</button></div>
    <div class="powered">Demo: the email is simulated.</div>`;
  if (S.signinStep === 2) el.innerHTML = `
    <h2 class="big">Welcome</h2>
    <p>One time only. Confirm your info so your leaders can reach you.</p>
    <div class="mailcard stack">
      <div class="field"><label for="pname">Your name</label><input id="pname" value="${esc(men[NOAH].name)}"></div>
      <div class="field"><label for="pphone">Cell number</label><input id="pphone" type="tel" value="${esc(men[NOAH].phone)}"></div>
      <div class="field"><label>Your group</label><div class="readonly">Saturday Group · Bryan Bailey</div><span class="small muted">Your leader added you. To change groups, ask him.</span></div>
      <div class="field"><label>Join the weekly prayer chain?</label><div class="seg">${seg('wchain', 1, S.welcomeChain, 'Yes')}${seg('wchain', 0, !S.welcomeChain, 'No')}</div><span class="small muted">Each week you'd call one man in the chain and pray with him. You can change this anytime.</span></div>
      <p class="small muted" style="margin:0">${PRIVACY}</p>
      <button class="bigbtn" data-act="signedin">Join Men's Precepts</button>
    </div>`;
}

// ---------- render ----------
function render() {
  renderTop(); renderTabs(); renderSignin();
  ['top', 'leaderbar', 'screen', 'tabs'].forEach(id => { $(id).inert = !S.signedIn; }); // keyboard focus stays on sign-in
  $('screen').innerHTML = { week: vWeek, ann: vAnn, group: vGroup, prayer: vPrayer, files: vFiles }[S.tab]();
  const pi = $('postin'); if (pi && S.postDraft) { pi.style.height = 'auto'; pi.style.height = Math.min(pi.scrollHeight + 2, 140) + 'px'; }
}
const keepDraft = () => { const t = $('atitle'), b = $('abody'), p = $('apin'); if (t) S.draft.title = t.value; if (b) S.draft.body = b.value; if (p) S.draft.pin = p.checked; };
const keepLesson = () => { const l = $('ulesson'); if (l) S.up.lesson = +l.value; };
const firstName = id => men[id].name.split(' ')[0];
const clearAsks = () => { S.confirmDel = S.confirmAnn = null; S.replyOpen = null; };
function sheetBack() { if (!S.sheet) return; if (S.sheet.kind === 'dm') { openSheet('messages'); renderTop(); } else if (S.sheet.kind === 'lesson') { S.confirmLesson = null; openSheet('schedule'); } else closeSheet(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  const act = t.dataset.act, tab = t.dataset.tab;
  if (tab && (!act || act === 'tab')) { S.tab = tab; clearAsks(); $('screen').scrollTop = 0; render(); return; }
  switch (act) {
    case 'viewas': S.me = S.me === NOAH ? BRYAN : NOAH; S.group = myGroups()[0]; S.tab = 'week'; clearAsks(); if (S.sheet) closeSheet(); $('screen').scrollTop = 0; render(); toast(S.me === BRYAN ? 'Now viewing as Bryan, a leader' : 'Now viewing as Noah, a member'); break;
    case 'pickgroup': openSheet('pickgroup'); break;
    case 'setgroup': S.group = t.dataset.v; clearAsks(); closeSheet(); $('screen').scrollTop = 0; toast(`Now showing the ${GROUPS[S.group].name}`); break;
    case 'messages': openSheet('messages'); break;
    case 'dm': openSheet('dm', t.dataset.id); break;
    case 'openfile': S.confirmFile = null; openSheet('file', +t.dataset.id); break;
    case 'close': sheetBack(); break;
    case 'schedule': openSheet('schedule'); break;
    // feed
    case 'delask': S.confirmDel = t.dataset.k; render(); break;
    case 'repmenu': S.confirmDel = S.confirmDel === t.dataset.k ? null : t.dataset.k; render(); break;
    case 'delno': S.confirmDel = null; render(); break;
    case 'delyes': { const k = t.dataset.k; S.confirmDel = null;
      if (k[0] === 'p') { S.posts = S.posts.filter(x => x.id !== +k.slice(1)); toast('Post deleted'); }
      else { const [pid, ri] = k.slice(1).split(':').map(Number); S.posts.find(x => x.id === pid).replies.splice(ri, 1); toast('Reply deleted'); }
      render(); break; }
    case 'reply': S.replyOpen = +t.dataset.id; S.confirmDel = null; render(); setTimeout(() => $('replyin') && $('replyin').focus(), 0); break;
    case 'replycancel': S.replyOpen = null; render(); break;
    // manage group
    case 'rmask': S.confirmRm = t.dataset.id; renderSheet(); break;
    case 'rmno': S.confirmRm = null; renderSheet(); break;
    case 'rmyes': { const id = t.dataset.id, f = firstName(id); S.confirmRm = null; const r = removeFromGroup(id); renderSheet(); render();
      toast(r.A && r.A !== r.B ? `${f} is out of the group. ${firstName(r.A)} now calls ${firstName(r.B)} until Sunday; both got a notification (demo).` : r.rebuilt ? `${f} is out of the group. The prayer chain was rebuilt and everyone got their new name (demo).` : `${f} is out of the group.`); break; }
    // announcements
    case 'togglepin': { const a = S.announcements.find(x => x.id === +t.dataset.id), g = myGroup(), on = !isPinned(a);
      if (on) pinFor(a, [g]); else a.pinnedFor = a.pinnedFor.filter(x => x !== g);
      render(); toast(on ? `Pinned for the ${GROUPS[g].name}. It shows first here and on This Week.` : 'Unpinned'); break; }
    case 'annask': S.confirmAnn = +t.dataset.id; render(); break;
    case 'annno': S.confirmAnn = null; render(); break;
    case 'annyes': S.announcements = S.announcements.filter(x => x.id !== +t.dataset.id); S.confirmAnn = null; render(); toast('Announcement deleted'); break;
    // files
    case 'fileask': S.confirmFile = true; renderSheet(); break;
    case 'fileno': S.confirmFile = null; renderSheet(); break;
    case 'fileyes': S.files = S.files.filter(x => x.id !== +t.dataset.id); closeSheet(); toast('File deleted'); break;
    // lesson schedule
    case 'editlesson': S.confirmLesson = null; openSheet('lesson', t.dataset.n); break;
    case 'lessonask': S.confirmLesson = true; renderSheet(); break;
    case 'lessonno': S.confirmLesson = null; renderSheet(); break;
    case 'lessonyes': { const n = S.editN; LESSONS.splice(LESSONS.indexOf(lessonOf(n)), 1); S.confirmLesson = null; openSheet('schedule'); toast(`Lesson ${n} deleted`); break; }
    case 'savelesson': { const ti = $('ltitle').value.trim(), pa = $('lpassage').value.trim(), dv = $('ldate').value; if (!ti) { toast('Add a title'); return; } if (!dv) { toast('Pick a date'); return; }
      const d = toSaturday(dateOf(dv)); sortLessons();
      if (S.editN === 'new') {
        const clash = LESSONS.find(x => dn(x.d) === dn(d)); if (clash) { toast(`Lesson ${clash.n} is already that week. Pick another week.`); return; }
        LESSONS.push({ n: Math.max(...LESSONS.map(x => x.n)) + 1, title: ti, passage: pa, d }); toast(`Lesson added for ${pairLabel(d)}`);
      } else {
        const L = lessonOf(S.editN), i = LESSONS.indexOf(L), prev = LESSONS[i - 1], days = dn(d) - dn(L.d);
        if (prev && dn(d) <= dn(prev.d)) { toast(dn(d) === dn(prev.d) ? `Lesson ${prev.n} is already that week. Pick another week.` : `That's before Lesson ${prev.n}. Pick a later week.`); return; }
        LESSONS.slice(i).forEach(x => { x.d = addDays(x.d, days); }); L.title = ti; L.passage = pa;
        toast(days ? `Saved. Lesson ${L.n} is now ${pairLabel(L.d)}${i < LESSONS.length - 1 ? ', and the lessons after it moved too' : ''}.` : 'Saved');
      }
      sortLessons(); openSheet('schedule'); break; }
    case 'zoom': toast('Opens Zoom (demo)'); break;
    case 'directions': toast('Opens Maps to Austin Ridge (demo)'); break;
    case 'fakeopen': toast('Opens the file on your phone (demo)'); break;
    // leader buttons
    case 'postupdate': openSheet('postupdate'); break;
    case 'addfiles': S.up.lesson = lessonForUploads(); openSheet('addfiles'); break;
    case 'manage': openSheet('manage'); break;
    case 'managechain': openSheet('manage', 'chain'); break;
    case 'daud': keepDraft(); S.draft.aud = t.dataset.v; renderSheet(); break;
    case 'postann': { keepDraft(); const d = S.draft; if (!d.title.trim() || !d.body.trim()) { toast('Add a title and a message'); return; }
      const aud = audOf(d.aud), a = { id: ++annId, from: S.me, aud, title: d.title.trim(), body: d.body.trim(), time: 'Just now', pinnedFor: [] };
      S.announcements.unshift(a); if (d.pin) pinFor(a, aud === 'all' ? ['sat', 'thu'] : [aud]);
      S.draft = { aud: 'group', pin: false, title: '', body: '' }; S.tab = 'ann'; closeSheet(); toast(aud === 'all' ? 'Posted to all groups and emailed (demo)' : `Posted to the ${audLabel(aud)} and emailed (demo)`); break; }
    case 'uaud': keepLesson(); S.up.aud = t.dataset.v; renderSheet(); break;
    case 'samplefile': { keepLesson(); const L = lessonOf(S.up.lesson); const opts = [`Lesson ${L.n} Discussion Guide.pdf`, `Lesson ${L.n} Lecture Slides.pptx`, `${L.passage.split(':')[0]} Cross References.docx`]; const name = opts[S.up.picked.length % opts.length]; S.up.picked.push({ name, type: ftype(name), size: ['220 KB', '4.8 MB', '64 KB'][S.up.picked.length % 3] }); renderSheet(); break; }
    case 'unpick': keepLesson(); S.up.picked.splice(+t.dataset.i, 1); renderSheet(); break;
    case 'doupload': { if (!S.up.picked.length) return; keepLesson(); const aud = audOf(S.up.aud), n = S.up.picked.length; S.up.picked.forEach(p => S.files.unshift({ id: ++fileId, lesson: S.up.lesson, name: p.name, type: p.type, size: p.size, by: S.me, date: 'Today', aud })); S.up.picked = []; closeSheet(); toast(`${n} ${n === 1 ? 'file' : 'files'} added to Lesson ${S.up.lesson}`); break; }
    case 'nextweek': { sundayMorning(); clearAsks(); render(); const L = thisLesson(); toast(`Sunday morning: ${L ? `This Week is now Lesson ${L.n}` : 'no class this week'}, and the prayer chain moved. Every man got his new name (demo).`); break; }
    case 'invite': { const v = ($('invite').value || '').trim(); if (!/^\S+@\S+\.\S+$/.test(v)) { toast('Enter an email address'); return; } $('invite').value = ''; toast('Invite sent (demo). He gets an email with a sign-in link.'); break; }
    // sign in
    case 'tostep2': if (S.welcomed) { S.signedIn = true; render(); toast(`Welcome back, ${firstName(NOAH)}`); } else { S.signinStep = 2; renderSignin(); } break;
    case 'wchain': S.welcomeChain = t.dataset.v === '1'; renderSignin(); break;
    case 'signedin': { const pn = $('pname'), pp = $('pphone'); if (pn && pn.value.trim()) setName(NOAH, pn.value.trim()); if (pp && pp.value.trim()) men[NOAH].phone = pp.value.trim();
      if (S.welcomeChain && !men[NOAH].inChain) setChainWish(NOAH, true); S.signedIn = true; S.welcomed = true; render(); toast(`Welcome, ${firstName(NOAH)}`); break; }
    // profile
    case 'profile': S.profChain = wantsChain(S.me); openSheet('profile'); break;
    case 'pchain': S.profChain = t.dataset.v === '1'; document.querySelectorAll('[data-act=pchain]').forEach(x => { const on = (x.dataset.v === '1') === S.profChain; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); break;
    case 'saveprofile': { const n = $('ename').value.trim(), ph = $('ephone').value.trim(), em = $('eemail').value.trim(); if (!n) { toast('Add your name'); return; } setName(S.me, n); if (ph) men[S.me].phone = ph; if (em) men[S.me].email = em;
      let extra = ''; if (S.profChain !== wantsChain(S.me)) { setChainWish(S.me, S.profChain); extra = S.profChain ? ` You're in the prayer chain starting ${nextSun()}.` : men[S.me].inChain ? ` You leave the prayer chain ${nextSun()}.` : ''; }
      closeSheet(); toast('Profile saved.' + extra); break; }
    case 'signout': S.signedIn = false; S.signinStep = 0; S.me = NOAH; S.group = 'sat'; S.tab = 'week'; clearAsks(); closeSheet(); break;
    // prayer chain
    case 'joinchain': setChainWish(S.me, true); render(); toast(`You're in, starting ${nextSun()}. You'll get the name of the man you call.`); break;
    case 'togglechain': { const id = t.dataset.id, f = firstName(id); setChainWish(id, !wantsChain(id)); toast(men[id].pending === 'join' ? `${f} joins the prayer chain Sunday` : men[id].pending === 'leave' ? `${f} leaves the prayer chain Sunday` : `${f} stays ${men[id].inChain ? 'in' : 'out of'} the prayer chain`); renderSheet(); render(); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) sheetBack(); });
document.addEventListener('input', e => { if (e.target.id === 'postin') { S.postDraft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight + 2, 140) + 'px'; } });
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'signin') { S.signinStep = 1; renderSignin(); }
  if (f === 'post') { const v = $('postin').value.trim(); if (!v) { toast('Write something first'); return; } S.posts.unshift({ id: ++postId, group: myGroup(), author: S.me, body: v, time: 'Just now', replies: [] }); S.postDraft = ''; render(); toast(`Posted to the ${GROUPS[myGroup()].name}`); }
  if (f === 'reply') { const v = $('replyin').value.trim(); if (!v) return; S.posts.find(p => p.id === +e.target.dataset.id).replies.push({ author: S.me, body: v }); S.replyOpen = null; render(); }
  if (f === 'dm') { const v = $('dmin').value.trim(); if (!v) return; myConvos().find(c => other(c) === S.sheet.arg).msgs.push({ from: S.me, body: v, time: 'Now' }); renderSheet(); setTimeout(() => $('dmin') && $('dmin').focus(), 0); }
});
render();
</script>
</body>
</html>
