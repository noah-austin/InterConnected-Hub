<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Men's Precepts">
<title>Men's Precepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Men's Precepts demo, built on Interconnected. Sample data only; nothing is saved. */
:root {
  --blue: #2563EB; --blue-soft: #E8EFFD; --navy: #0F1B33; --navy-2: #1B2A4A;
  --ink: #1F2937; --muted: #6B7280; --line: #E5E7EB; --bg: #F3F4F6; --card: #FFFFFF;
  --green: #059669; --green-soft: #E3F5EE; --amber: #B45309; --amber-soft: #FDF1E3;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light only;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--navy); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; overflow: clip; }
@media (min-width: 520px) { body { padding: 24px 0; } .app { height: calc(100% - 48px); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.35); } }

/* header */
.top { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; display: flex; align-items: center; gap: 12px; flex: none; }
.top .mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.08); display: grid; place-items: center; flex: none; }
.top .t { flex: 1; min-width: 0; }
.top h1 { font-size: 1.02rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top .sub { font-size: .78rem; color: #AFC0DE; margin: 0; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; position: relative; color: #fff; }
.iconbtn:hover { background: rgba(255,255,255,.08); }
.badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: #EF4444; color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.leaderbar { background: var(--amber-soft); color: var(--amber); font-size: .8rem; font-weight: 600; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; flex: none; }
.leaderbar button { text-decoration: underline; font-weight: 600; color: var(--amber); }

/* body */
.screen { flex: 1; overflow-y: auto; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; }
.sec-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 2px 8px; }
.sec-label:first-child { margin-top: 2px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid var(--line); }
.stack { display: grid; gap: 10px; }
.h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }

/* lesson hero */
.lesson { background: linear-gradient(160deg, var(--navy-2), var(--navy)); color: #fff; border: 0; padding: 18px; }
.lesson .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: #93B4F5; font-weight: 700; }
.lesson .title { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
.lesson .passage { color: #C9D6EE; font-weight: 500; }
.meet { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 12px; align-items: center; }
.meet .when { font-weight: 600; }
.meet .where { color: #C9D6EE; font-size: .85rem; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .85rem; }
.pillbtn.ghost { background: var(--blue-soft); color: var(--blue); }
.pillbtn.light { background: rgba(255,255,255,.12); color: #fff; }

/* announcement */
.ann .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ann h3 { font-size: 1rem; margin: 4px 0 4px; }
.ann p { margin: 0; }
.tag { font-size: .7rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--blue-soft); color: var(--blue); }
.tag.pin { background: var(--amber-soft); color: var(--amber); }
.tag.green { background: var(--green-soft); color: var(--green); }

/* files */
.file { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; padding-top: 0; }
.file:last-child { padding-bottom: 0; }
.ficon { width: 38px; height: 44px; border-radius: 7px; display: grid; place-items: center; font-size: .62rem; font-weight: 800; color: #fff; flex: none; letter-spacing: .03em; }
.ficon.pdf { background: #DC2626; } .ficon.doc { background: #2563EB; } .ficon.audio { background: #7C3AED; } .ficon.slides { background: #D97706; } .ficon.sheet { background: #059669; }
.file .fn { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.file .fm { font-size: .76rem; color: var(--muted); }
.lessonhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.lessonhead strong { font-size: .95rem; }

/* prayer chain */
.partner { text-align: center; padding: 22px 16px; }
.partner .av { margin: 0 auto 10px; }
.partner .name { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
.pnote { margin-top: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: .9rem; text-align: left; color: var(--ink); }
.pairs { display: grid; gap: 0; }
.pair { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.pair:first-child { border-top: 0; padding-top: 0; }
.pair .x { color: var(--muted); flex: none; }
.pair .n { flex: 1; min-width: 0; }
.pair.me { font-weight: 700; color: var(--blue); }

/* avatars */
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; color: #fff; flex: none; }
.av.lg { width: 56px; height: 56px; font-size: 1.1rem; margin: 0 auto 10px; }

/* group feed: casual posts with short replies */
.composer { display: grid; gap: 8px; }
.composer .crow { display: flex; gap: 10px; align-items: flex-start; }
.composer textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); resize: none; height: 66px; outline: none; font: inherit; }
.composer textarea:focus { border-color: var(--blue); background: #fff; }
.composer .cfoot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-left: 46px; }
.postbtn { background: var(--blue); color: #fff; border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: .85rem; }
.post { padding: 12px 14px; }
.post .head { display: flex; gap: 10px; align-items: center; }
.post .av { width: 32px; height: 32px; font-size: .7rem; }
.post .who { font-weight: 700; font-size: .9rem; }
.post .when { font-size: .74rem; color: var(--muted); }
.post .body { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.replies { margin-top: 10px; display: grid; gap: 6px; }
.rep { display: flex; gap: 8px; align-items: flex-start; }
.rep .av { width: 24px; height: 24px; font-size: .58rem; margin-top: 2px; }
.rep .rb { background: var(--bg); border-radius: 12px; padding: 6px 10px; font-size: .88rem; min-width: 0; overflow-wrap: anywhere; }
.rep .rb strong { font-size: .8rem; }
.postacts { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.postacts button { font-size: .8rem; font-weight: 700; color: var(--blue); }
.replyform { display: flex; gap: 6px; margin-top: 8px; }
.replyform input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: var(--bg); outline: none; font-size: .88rem; }
.replyform input:focus { border-color: var(--blue); background: #fff; }
.replyform button { color: var(--blue); font-weight: 700; font-size: .85rem; padding: 0 6px; }

/* prayer chain */
.phone { font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.callrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.callbtn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border-radius: 12px; padding: 12px; font-weight: 700; text-decoration: none; background: var(--blue); color: #fff; }
.callbtn.alt { background: var(--blue-soft); color: var(--blue); }
.minicall { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: .84rem; text-decoration: none; background: var(--blue); color: #fff; flex: none; }
.ph { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* tabs */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); }
.tabs.four { grid-template-columns: repeat(4, 1fr); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: .64rem; min-width: 0; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--blue); }
.tab svg { width: 22px; height: 22px; }

/* overlays */
.sheet { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; transform: translateX(100%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.sheet.open { transform: none; visibility: visible; transition: transform .22s ease; }
.sheet .top { background: #fff; color: var(--ink); border-bottom: 1px solid var(--line); }
.sheet .top .iconbtn { color: var(--ink); }
.sheet .top .iconbtn:hover { background: var(--bg); }
.sheet .top h1 { font-size: 1rem; }
.sheet .top .sub { color: var(--muted); }
.inputbar { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: #fff; border-top: 1px solid var(--line); }
.inputbar input { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; background: var(--bg); outline: none; }
.inputbar input:focus { border-color: var(--blue); }
.sendbtn { width: 42px; height: 42px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.bubbles { display: grid; gap: 8px; }
.bubble { max-width: 80%; padding: 9px 13px; border-radius: 16px; background: #fff; border: 1px solid var(--line); justify-self: start; }
.bubble.mine { background: var(--blue); color: #fff; border-color: var(--blue); justify-self: end; }
.bubble .bt { font-size: .7rem; opacity: .7; margin-top: 2px; }
.convo { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.convo:first-child { border-top: 0; padding-top: 0; }
.convo .cn { font-weight: 600; }
.convo .cp { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; }

/* forms */
.field { display: grid; gap: 6px; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: #fff; outline: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--blue); }
.field textarea { min-height: 110px; resize: vertical; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: .84rem; font-weight: 600; }
.seg button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.bigbtn { width: 100%; background: var(--blue); color: #fff; border-radius: 12px; padding: 13px; font-weight: 700; }
.bigbtn.secondary { background: var(--blue-soft); color: var(--blue); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.drop { border: 2px dashed #C7D2E5; border-radius: 12px; padding: 18px; text-align: center; background: #fff; }
.note { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 4px; }

/* sign in */
.signin { position: absolute; inset: 0; z-index: 40; background: linear-gradient(170deg, var(--navy-2), var(--navy)); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 32px 28px calc(env(safe-area-inset-bottom, 0px) + 32px); gap: 18px; }
.signin .big { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.signin p { color: #C9D6EE; margin: 0; }
.signin form input { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 1rem; }
.signin .mailcard p { color: var(--muted); }
.signin .powered { font-size: .76rem; color: #8FA3C7; text-align: center; }
.mailcard { background: #fff; color: var(--ink); border-radius: 14px; padding: 16px; }

/* toast */
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: .85rem; font-weight: 600; opacity: 0; transition: all .2s; z-index: 60; pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="leaderbar" id="leaderbar" hidden></div>
  <main class="screen" id="screen"></main>
  <nav class="tabs" id="tabs"></nav>
  <section class="sheet" id="sheet" aria-hidden="true"></section>
  <div class="signin" id="signin"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
// ---------- icons (Feather-style, inline) ----------
const I = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  mega: '<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
  group: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/>',
  pray: '<path d="M12 21s-7-4.5-9-9.5C1.6 7.9 3.8 4.5 7.3 4.5c2 0 3.5 1.1 4.7 2.8 1.2-1.7 2.7-2.8 4.7-2.8 3.5 0 5.7 3.4 4.3 7-2 5-9 9.5-9 9.5z"/>',
  folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
  msg: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  send: '<path d="M4 12 20 4l-6 16-3-7z"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  pin: '<path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/>',
  upload: '<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  shuffle: '<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>',
  users: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.7 3.5-5.6 7-5.6s6.3 1.9 7 5.6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  shield: '<path d="M12 3 4.5 6v6c0 4.4 3.2 7.7 7.5 9 4.3-1.3 7.5-4.6 7.5-9V6z"/>',
  chev: '<path d="m9 5 7 7-7 7"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  phone: '<path d="M5 3.5h3.2l1.6 4.2-2.1 1.3a11 11 0 0 0 5.3 5.3l1.3-2.1 4.2 1.6V17a2 2 0 0 1-2 2A15.5 15.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
};
const ic = (n, s = 22, sw = 1.9) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const MARK = `<svg viewBox="0 0 26 32" width="20" height="24" aria-hidden="true"><g fill="#93B4F5"><circle cx="13" cy="3.5" r="2.4"/><circle cx="13" cy="10" r="2.4"/><circle cx="6.5" cy="12.5" r="2.2"/><circle cx="19.5" cy="12.5" r="2.2"/><circle cx="1.8" cy="12.5" r="1.6" opacity=".7"/><circle cx="24.2" cy="12.5" r="1.6" opacity=".7"/><circle cx="13" cy="16.5" r="2.4"/><circle cx="13" cy="23" r="2.4"/><circle cx="13" cy="29" r="2"/></g></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- sample data ----------
const COLORS = ['#2563EB', '#059669', '#7C3AED', '#B45309', '#DB2777', '#0891B2', '#4F46E5', '#65A30D', '#9333EA', '#DC2626', '#0F766E', '#C2410C'];
const SAT = ['Noah Austin', 'Mark Ellison', 'Tom Alvarez', 'Chris Delgado', 'Jim Whitaker', 'Ray Holloway', 'Dan Mercer', 'Luis Romero', 'Steve Park', 'Greg Lawson', 'Matt Kessler', 'Rob Tanner', 'Ben Ashford', 'Will Carver', 'Jeff Nolan', 'Sam Okafor', 'Pete Langley', 'Ken Brady', 'Andre Wallace', 'Joe Castillo', 'Tim Reyes', 'Doug Hensley', 'Paul Whitfield', 'Ethan Moore'];
const THU = ['Carl Jensen', 'Hector Ruiz', 'Neil Patterson', 'Frank Osei', 'Gary Lindqvist', 'Victor Hale', 'Jon Pruitt', 'Aaron Fields', 'Mike Duarte', 'Scott Rowan', 'Brent Ivers', 'Lance Coleman', 'Rick Sorensen', 'Owen Blake', 'Trevor Haynes', 'Calvin Price', 'Marcus Bell', 'Isaac Nunez'];
const men = {};
const addMan = (name, group, leader = false) => {
  const id = name.toLowerCase().replace(/[^a-z]/g, '');
  const k = Object.keys(men).length;
  men[id] = { id, name, group, leader, initials: name.split(' ').map(w => w[0]).join(''), color: COLORS[k % COLORS.length], phone: `(512) 555-01${String(k).padStart(2, '0')}` };
  return id;
};
addMan('Bryan Bailey', 'both', true);
SAT.forEach(n => addMan(n, 'sat'));
THU.forEach(n => addMan(n, 'thu'));
const NOAH = 'noahaustin', BRYAN = 'bryanbailey';

const GROUPS = {
  sat: { id: 'sat', name: 'Saturday Group', when: 'Saturdays, 8:00 AM', where: 'Austin Ridge', zoom: false },
  thu: { id: 'thu', name: 'Thursday Group', when: 'Thursdays, 7:00 PM', where: 'On Zoom', zoom: true },
};

// Lesson titles and dates are sample content for the demo.
const LESSONS = [
  { n: 1, title: 'Behold, Your King', passage: 'Matthew 1–2', date: 'Sep 19' },
  { n: 2, title: 'Prepare the Way', passage: 'Matthew 3', date: 'Sep 26' },
  { n: 3, title: 'Tested in the Wilderness', passage: 'Matthew 4:1–11', date: 'Oct 3' },
  { n: 4, title: 'Follow Me', passage: 'Matthew 4:12–25', date: 'Oct 10' },
  { n: 5, title: 'The Blessed Life', passage: 'Matthew 5:1–16', date: 'Oct 17' },
  { n: 6, title: 'Fulfilling the Law', passage: 'Matthew 5:17–48', date: 'Oct 24' },
  { n: 7, title: 'Righteousness in Secret', passage: 'Matthew 6:1–18', date: 'Oct 31' },
];
const CURRENT = 7;

// pairings: one-to-one, mutual; an odd man out makes one group of three
function makePairs(ids, seedFirst) {
  const a = ids.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (seedFirst) { // keep the demo story: Noah with Mark
    a.splice(a.indexOf(seedFirst[0]), 1); a.splice(a.indexOf(seedFirst[1]), 1); a.unshift(seedFirst[0], seedFirst[1]);
  }
  const out = [];
  for (let i = 0; i < a.length; i += 2) out.push(a.slice(i, i + 2));
  if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(out.pop()[0]);
  return out;
}

    <h2 class="big">Check your email</h2>
    <p>We sent a sign-in link to ${esc($('email') ? $('email').value : 'your email')}.</p>
    <div class="mailcard"><div class="row small muted">${ic('mail', 18)} Men's Precepts · now</div><div style="font-weight:700;margin-top:8px">Your sign-in link</div><div class="small muted" style="margin:4px 0 12px">Tap below to open Men's Precepts. This link works once.</div><button class="bigbtn" data-act="tostep2">Sign in to Men's Precepts</button></div>
    <div class="powered">Demo: the email is simulated.</div>`;
  if (S.signinStep === 2) el.innerHTML = `
    <h2 class="big">Welcome</h2>
    <p>One time only. Confirm your info so your prayer partner can reach you.</p>
    <div class="mailcard stack">
      <div class="field"><label for="pname">Your name</label><input id="pname" value="Noah Austin"></div>
      <div class="field"><label for="pphone">Cell number</label><input id="pphone" type="tel" value="${esc(men[NOAH].phone)}"></div>
      <div class="field"><label for="pgroup">Your group</label><select id="pgroup"><option>Saturday Group (Bryan Bailey)</option><option>Thursday Group on Zoom (Bryan Bailey)</option></select></div>
      <p class="small muted" style="margin:0">Your number is shared only with your prayer partner and your leaders.</p>
      <button class="bigbtn" data-act="signedin">Join Men's Precepts</button>
    </div>`;
}

// ---------- render ----------
function render() {
  renderTop(); renderTabs(); renderSignin();
  const v = S.mode === 'leader'
    ? { announce: vAnnounce, upload: vUpload, chain: vChain, roster: vRoster }[S.ltab]()
    : { week: vWeek, ann: vAnn, group: vGroup, prayer: vPrayer, files: vFiles }[S.tab]();
  $('screen').innerHTML = v;

  const fi = $('ufile'); if (fi) fi.onchange = e => { [...e.target.files].forEach(f => S.up.picked.push({ name: f.name, type: ftype(f.name), size: f.size > 1e6 ? (f.size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1e3)) + ' KB' })); render(); };
}
const keepDraft = () => { const t = $('atitle'), b = $('abody'), p = $('apin'); if (t) S.draft.title = t.value; if (b) S.draft.body = b.value; if (p) S.draft.pin = p.checked; };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  const act = t.dataset.act, tab = t.dataset.tab;
  if (tab && (!act || act === 'tab')) {
    if (S.mode === 'leader' && !act) { keepDraft(); S.ltab = tab; } else { S.tab = tab; }
    $('screen').scrollTop = 0; render(); return;
  }
  switch (act) {
    case 'switch': keepDraft(); S.mode = S.mode === 'leader' ? 'member' : 'leader'; S.me = S.mode === 'leader' ? BRYAN : NOAH; if (S.mode === 'member') S.tab = 'week'; if (S.sheet) closeSheet(); render(); toast(S.mode === 'leader' ? 'Leader view: Bryan Bailey' : 'Back to Noah\'s view'); break;
    case 'messages': openSheet('messages'); break;
    case 'dm': openSheet('dm', t.dataset.id); break;
    case 'openfile': openSheet('file', +t.dataset.id); break;
    case 'close': closeSheet(); break;
    case 'zoom': toast('Opens Zoom (demo)'); break;
    case 'directions': toast('Opens Maps to Austin Ridge (demo)'); break;
    case 'fakeopen': toast('Opens the file on your phone (demo)'); break;
    case 'reply': S.replyOpen = +t.dataset.id; render(); setTimeout(() => $('replyin') && $('replyin').focus(), 0); break;
    case 'daud': keepDraft(); S.draft.aud = t.dataset.v; render(); break;
    case 'postann': { keepDraft(); const d = S.draft; if (!d.title.trim() || !d.body.trim()) { toast('Add a title and a message'); return; }
      if (d.pin) S.announcements.forEach(a => a.pinned = false);
      S.announcements.unshift({ id: ++annId, from: BRYAN, aud: d.aud, title: d.title.trim(), body: d.body.trim(), time: 'Just now', pinned: d.pin });
      S.draft = { aud: 'all', pin: false, title: '', body: '' }; render(); toast(`Posted to ${audLabel(d.aud)}, and emailed`); break; }
    case 'uaud': S.up.aud = t.dataset.v; S.up.lesson = +$('ulesson').value; render(); break;
    case 'samplefile': { S.up.lesson = +$('ulesson').value; const L = lessonOf(S.up.lesson); const opts = [`Lesson ${L.n} Discussion Guide.pdf`, `Lesson ${L.n} Lecture Slides.pptx`, `${L.passage.split(':')[0]} Cross References.docx`]; const name = opts[S.up.picked.length % opts.length]; S.up.picked.push({ name, type: ftype(name), size: ['220 KB', '4.8 MB', '64 KB'][S.up.picked.length % 3] }); render(); break; }
    case 'unpick': S.up.picked.splice(+t.dataset.i, 1); render(); break;
    case 'doupload': { if (!S.up.picked.length) return; S.up.lesson = +$('ulesson').value; const n = S.up.picked.length; S.up.picked.forEach(p => S.files.unshift({ id: ++fileId, lesson: S.up.lesson, name: p.name, type: p.type, size: p.size, by: BRYAN, date: 'Today', aud: S.up.aud })); S.up.picked = []; render(); toast(`${n} ${n === 1 ? 'file' : 'files'} added to Lesson ${S.up.lesson}`); break; }
    case 'lgroup': S.lgroup = t.dataset.v; render(); break;
    case 'shuffle': S.pairs[S.lgroup] = makePairs(groupIds(S.lgroup)); render(); toast('New pairs ready. Send when you\'re happy.'); break;
    case 'publish': toast(`Texted each man in the ${GROUPS[S.lgroup].name} his partner`); break;
    case 'invite': { const v = ($('invite').value || '').trim(); if (!/^\S+@\S+\.\S+$/.test(v)) { toast('Enter an email address'); return; } $('invite').value = ''; toast('Invite ready. In the real app it emails a sign-in link.'); break; }
    case 'tostep2': S.signinStep = 2; renderSignin(); break;
    case 'signedin': S.signedIn = true; render(); toast('Welcome, Noah'); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'signin') { S.signinStep = 1; renderSignin(); }
  if (f === 'post') { const v = $('postin').value.trim(); if (!v) { toast('Write something first'); return; } S.posts.unshift({ id: ++postId, group: myGroup(), author: S.me, body: v, time: 'Just now', replies: [] }); render(); toast('Posted to your group'); }
  if (f === 'reply') { const v = $('replyin').value.trim(); if (!v) return; S.posts.find(p => p.id === +e.target.dataset.id).replies.push({ author: S.me, body: v }); S.replyOpen = null; render(); }
  if (f === 'dm') { const v = $('dmin').value.trim(); if (!v) return; S.convos.find(c => c.with === S.sheet.arg).msgs.push({ from: S.me, body: v, time: 'Now' }); renderSheet(); setTimeout(() => $('dmin') && $('dmin').focus(), 0); }
});
render();
</script>
</body>
</html>
